name: amarktai_marketing

services:
  # Shared-VPS production model:
  # - Host Nginx owns public :80/:443 for all apps
  # - Docker only exposes app-specific localhost ports
  # ─── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: amarktai
      POSTGRES_USER: amarktai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repo root .env or shell environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amarktai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://amarktai:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repo root .env or shell environment}@db:5432/amarktai
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: https://${DOMAIN:-marketing.amarktai.com}
      CORS_ORIGINS: '["https://${DOMAIN:-marketing.amarktai.com}"]'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H 'Host: ${DOMAIN:-marketing.amarktai.com}' http://127.0.0.1:8000/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Celery Worker ───────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://amarktai:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repo root .env or shell environment}@db:5432/amarktai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_uploads:/app/uploads

  # ─── Celery Beat (Scheduler) ──────────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://amarktai:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repo root .env or shell environment}@db:5432/amarktai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── React/Vite Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./app
      dockerfile: ../Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_uploads:
