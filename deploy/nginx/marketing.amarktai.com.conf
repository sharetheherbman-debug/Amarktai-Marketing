# Host-level Nginx site for marketing.amarktai.com on a shared VPS.
# Marketing production path:
# - Host Nginx terminates public 80/443
# - Backend runs as systemd on 127.0.0.1:8010
# - Frontend is static files at /var/www/amarktai-marketing/current/app/dist

server {
    listen 80;
    listen [::]:80;
    server_name marketing.amarktai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marketing.amarktai.com;

    ssl_certificate /etc/letsencrypt/live/marketing.amarktai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketing.amarktai.com/privkey.pem;

    client_max_body_size 50M;

    access_log /var/log/nginx/marketing.amarktai.com.access.log;
    error_log /var/log/nginx/marketing.amarktai.com.error.log warn;

    root /var/www/amarktai-marketing/current/app/dist;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8010/api/v1/;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8010/health;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8010/docs;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8010/openapi.json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
