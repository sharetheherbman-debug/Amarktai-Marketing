# Host-level Nginx site for builder.amarktai.com on a shared VPS.
# Public :80/:443 stay on the host Nginx. Docker only listens on localhost.
#
# Install:
#   sudo cp deploy/nginx/builder.amarktai.com.conf /etc/nginx/sites-available/builder.amarktai.com
#   sudo ln -sf /etc/nginx/sites-available/builder.amarktai.com /etc/nginx/sites-enabled/builder.amarktai.com
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# TLS / Certbot:
# - If certificates already exist for builder.amarktai.com, this file is ready as-is.
# - If certificates do not exist yet, provision them first with Certbot and then enable
#   the 443 server block paths below.

server {
    listen 80;
    listen [::]:80;
    server_name builder.amarktai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name builder.amarktai.com;

    ssl_certificate /etc/letsencrypt/live/builder.amarktai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/builder.amarktai.com/privkey.pem;

    client_max_body_size 50M;

    access_log /var/log/nginx/builder.amarktai.com.access.log;
    error_log /var/log/nginx/builder.amarktai.com.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host builder.amarktai.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location /api/amarktai/ {
        proxy_pass http://127.0.0.1:8000/api/amarktai/;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000/media/;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8000/docs;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
    }

    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
